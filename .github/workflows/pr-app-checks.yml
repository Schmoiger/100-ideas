name: PR App Checks

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "context/**"
      - "typst/**"
      - ".github/workflows/pr-subrepo-checks.yml"
  push:
    branches: [main, master]
    paths-ignore:
      - "context/**"
      - "typst/**"
      - ".github/workflows/pr-subrepo-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  app-checks:
    name: Application Checks
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Placeholder Application Check
        run: |
          echo "Placeholder for application-specific checks (services, APIs, frontends)."
          echo "Add application test suites, builds, or linting here."

      - name: Enable Corepack
        if: ${{ hashFiles('package.json') != '' }}
        run: corepack enable

      - name: Set up Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Run TypeScript Tests
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          yarn install --immutable
          if node -e 'const pkg = require("./package.json"); process.exit(pkg.scripts && pkg.scripts.test ? 0 : 1)'; then
            yarn test
          else
            echo "No test script defined in package.json, skipping test run."
          fi
