# Auto-generated by context/scripts/generators/generate_adapters.py — do not edit manually

name: PR Subrepo Push

on:
  push:
    branches: [main, master]
    paths:
      - "context/**"
      - "typst/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect-subrepos:
    name: Check Subrepo Modifications
    runs-on: ubuntu-latest
    outputs:
      context_changed: ${{ steps.filter.outputs.context }}
      typst_changed: ${{ steps.filter.outputs.typst }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            context:
              - 'context/**'
            typst:
              - 'typst/**'

  sync-subrepos:
    name: Subrepo Upstream Sync
    needs: detect-subrepos
    if: ${{ needs.detect-subrepos.outputs.context_changed == 'true' || needs.detect-subrepos.outputs.typst_changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PUSH_TOKEN || github.token }}
          persist-credentials: false

      - name: Evaluate Push Authentication
        id: auth-check
        run: |
          if [ -n "${{ secrets.UPSTREAM_PUSH_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git identity
        if: steps.auth-check.outputs.has_token == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install git-subrepo
        if: steps.auth-check.outputs.has_token == 'true'
        run: |
          git clone --depth 1 --branch 0.4.9 https://github.com/ingydotnet/git-subrepo.git /tmp/git-subrepo
          echo "GIT_SUBREPO_ROOT=/tmp/git-subrepo" >> $GITHUB_ENV
          echo "/tmp/git-subrepo/lib" >> $GITHUB_PATH
          echo "MANPATH=/tmp/git-subrepo/man:$MANPATH" >> $GITHUB_ENV

      - name: Sync Subrepos to Upstream
        if: steps.auth-check.outputs.has_token == 'true'
        env:
          PUSH_TOKEN: ${{ secrets.UPSTREAM_PUSH_TOKEN }}
        run: |
          echo "Configuring subrepo credentials..."
          # Unset local extraheader written by actions/checkout so it cannot override the PAT
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --global url."https://x-access-token:${PUSH_TOKEN}@github.com/".insteadOf "https://github.com/"

          SYNC_FAILED=false

          sync_subrepo() {
            local subdir=$1
            echo "=== Synchronising $subdir/ ==="

            # 1. Fetch upstream to inspect current remote HEAD
            echo "Fetching upstream ref for $subdir..."
            git subrepo fetch "$subdir"
            local upstream_head
            upstream_head=$(git rev-parse "refs/subrepo/$subdir/fetch")
            local tracked_commit
            tracked_commit=$(git config --file="$subdir/.gitrepo" subrepo.commit)

            echo "Tracked: $tracked_commit | Upstream: $upstream_head"

            local was_auto_merged=false
            # 2. Check for upstream divergence
            if [ "$upstream_head" != "$tracked_commit" ]; then
              echo "Upstream has new commits ($tracked_commit -> $upstream_head)."
              echo "Attempting automated 3-way reconciliation (pull before push)..."
              if ! git subrepo pull "$subdir"; then
                echo "::error::Automated pull for '$subdir' failed due to merge conflicts. Manual reconciliation required."
                echo "${subdir}_sync_status=conflict" >> "$GITHUB_ENV"
                SYNC_FAILED=true
                return 1
              fi
              echo "Automated pull succeeded cleanly."
              was_auto_merged=true
            fi

            # 3. Push local changes upstream
            echo "Pushing $subdir/ upstream..."
            if ! git subrepo push "$subdir"; then
              echo "::error::git subrepo push '$subdir' failed."
              echo "${subdir}_sync_status=failed" >> "$GITHUB_ENV"
              SYNC_FAILED=true
              return 1
            fi

            if [ "$was_auto_merged" == "true" ]; then
              echo "${subdir}_sync_status=auto_merged" >> "$GITHUB_ENV"
            else
              echo "${subdir}_sync_status=pushed" >> "$GITHUB_ENV"
            fi
          }

          if [ "${{ needs.detect-subrepos.outputs.context_changed }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            sync_subrepo context || true
          fi

          if [ "${{ needs.detect-subrepos.outputs.typst_changed }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            sync_subrepo typst || true
          fi

          # Push updated .gitrepo tracking commits back to main
          echo "Pushing updated subrepo tracking commits back..."
          git push origin HEAD:${{ github.ref_name }}

          if [ "$SYNC_FAILED" == "true" ]; then
            echo "One or more subrepos encountered sync errors."
            exit 1
          fi

      - name: Generate Subrepo Push Summary
        if: always()
        run: |
          format_status() {
            local sub=$1
            local changed=$2
            local status_var="${sub}_sync_status"
            local status_val="${!status_var}"

            if [ "${{ steps.auth-check.outputs.has_token }}" != "true" ]; then
              if [ "$changed" == "true" ]; then
                echo "⚠️ Pending Manual Push (\`UPSTREAM_PUSH_TOKEN\` not configured)"
              else
                echo "➖ Up to date"
              fi
              return
            fi

            if [ "$changed" != "true" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
              echo "➖ Up to date"
              return
            fi

            case "$status_val" in
              auto_merged) echo "🔄 Auto-merged & Pushed" ;;
              pushed)      echo "🚀 Pushed Upstream" ;;
              conflict)    echo "❌ Merge Conflict (Manual Pull Required)" ;;
              failed)      echo "⚠️ Push Failed" ;;
              *)           echo "🚀 Pushed Upstream" ;;
            esac
          }

          CONTEXT_STATUS=$(format_status context "${{ needs.detect-subrepos.outputs.context_changed }}")
          TYPST_STATUS=$(format_status typst "${{ needs.detect-subrepos.outputs.typst_changed }}")

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### 📦 Subrepo Status Summary

          | Subrepo | Modified in Merge | Upstream Sync Status |
          |---|---|---|
          | \`context/\` | ${{ needs.detect-subrepos.outputs.context_changed == 'true' && '✅ Yes' || '➖ No' }} | $CONTEXT_STATUS |
          | \`typst/\` | ${{ needs.detect-subrepos.outputs.typst_changed == 'true' && '✅ Yes' || '➖ No' }} | $TYPST_STATUS |

          EOF

          if [ "$context_sync_status" == "conflict" ] || [ "$typst_sync_status" == "conflict" ]; then
            cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          > ❌ **Action Required: Subrepo Merge Conflict**
          > Upstream canonical repository has changes that conflicted with local modifications.
          > To resolve locally:
          > ```bash
          > git checkout main && git pull
          > PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" git subrepo pull <subdir>
          > # Resolve any conflicts, test, and commit:
          > git add <subdir>/
          > git commit -m "fix(subrepo): resolve upstream merge conflicts"
          > PATH="/opt/homebrew/bin:/usr/local/bin:$PATH" git subrepo push <subdir>
          > git push origin main
          > ```
          EOF
          elif [ "${{ steps.auth-check.outputs.has_token }}" != "true" ] && ([ "${{ needs.detect-subrepos.outputs.context_changed }}" == "true" ] || [ "${{ needs.detect-subrepos.outputs.typst_changed }}" == "true" ]); then
            cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          > 💡 **Tip**: To enable automatic upstream pushing on merge, add a GitHub repository secret named `UPSTREAM_PUSH_TOKEN` with write access to `Schmoiger/agents-framework` and `Schmoiger/typst-engine`.
          > Alternatively, run locally:
          > ```bash
          > git checkout main && git pull
          > git subrepo push context
          > git subrepo push typst
          > ```
          EOF
          fi

