name: PR Subrepo Checks

on:
  pull_request:
    branches: [main, master]
    paths:
      - "context/**"
      - "typst/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr-subrepo-checks.yml"
  push:
    branches: [main, master]
    paths:
      - "context/**"
      - "typst/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pr-subrepo-checks.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  subrepo-checks:
    name: Subrepo Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_PUSH_TOKEN || github.token }}

      - name: Set up uv & Python 3.14
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Run Ruff Linter
        if: ${{ hashFiles('context/scripts/validators/**/*.py') != '' }}
        run: uv run --with ruff ruff check context/scripts/validators/

      - name: Generate Runtime Projections
        run: uv run python context/scripts/generators/generate_adapters.py

      - name: Run Automated Test Suite
        run: uv run pytest -v

      - name: Check Adapter Drift
        run: uv run python context/scripts/validators/adapter_drift.py

      - name: Validate Agent Definitions
        run: uv run python context/scripts/validators/agent_definitions.py

      - name: Verify Typst Formatting Rules
        run: uv run python context/scripts/validators/verify_typst_formatting.py typst/

      - name: Check Subrepo Upstream Freshness
        if: github.event_name == 'pull_request'
        env:
          PUSH_TOKEN: ${{ secrets.UPSTREAM_PUSH_TOKEN }}
        run: |
          if [ -n "$PUSH_TOKEN" ]; then
            git config --global url."https://x-access-token:${PUSH_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi
          uv run python context/scripts/validators/subrepo_freshness.py --allow-offline

